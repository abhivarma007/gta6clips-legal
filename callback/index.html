<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TikTok Login</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222;background:#fff}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:6px;font-size:14px}button{margin-top:10px;padding:8px 16px;font-size:15px}</style></head>
<body><h1>TikTok login</h1><div id="out">Reading code…</div>
<script>
const q=new URLSearchParams(location.search), c=q.get('code'), e=q.get('error_description')||q.get('error');
const o=document.getElementById('out');
if(c){o.innerHTML='<p>Copy this code and finish the login in the terminal with <b>streamclips auth tiktok --code &lt;code&gt;</b>:</p><code id="c"></code><button id="b">Copy</button>';
document.getElementById('c').textContent=c;
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(c);document.getElementById('b').textContent='Copied';};}
else{o.textContent=e?('TikTok returned an error: '+e):'No code in this link.';}
</script></body></html>
